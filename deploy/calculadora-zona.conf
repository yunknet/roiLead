# Calculadora da Reforma Tributária — limite de uso por visitante (contexto http do nginx).
# A página é gratuita e aberta; o limite protege a VPS de abuso.

# IP real do visitante: o Easypanel (Traefik) fica na frente e envia X-Forwarded-For.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# 120 chamadas por minuto por IP (uma tela da calculadora faz ~10 chamadas ao abrir).
limit_req_zone $binary_remote_addr zone=calculadora:10m rate=120r/m;
